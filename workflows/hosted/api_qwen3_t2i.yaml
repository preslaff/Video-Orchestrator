name: api_qwen3_t2i
kind: keyframe
template: api_qwen3_t2i.json
description: 'Generate detailed, production-ready images from text prompts using the
  Qwen Image 3.0 Pro model, supporting up to 4.5k tokens for complex layouts like
  posters, infographics, and storyboards. It renders crisp 10px text, realistic textures,
  and native support for 12 languages and over 100 art styles, '
tags:
- api
- hosted
- keyframe
outputs:
  type: image
  nodes:
  - '2'
params:
  filename_prefix:
    node: '2'
    field: filename_prefix
    type: str
  positive:
    node: '14'
    field: model.prompt
    type: str
    required: true
  negative:
    node: '14'
    field: model.negative_prompt
    type: str
  width:
    node: '14'
    field: model.width
    type: int
  height:
    node: '14'
    field: model.height
    type: int
  seed:
    node: '14'
    field: seed
    type: int
    required: true
cost:
  min_usd: 0.0572
  max_usd: 0.10725

# cost: pro: .0572 up to 2.25 MP, .10725 above
# Read from ComfyUI's price_badge on 2026-09-30 (api.comfy.org credits, not the provider's list price).
