name: api_ideogram_v4_t2i
kind: keyframe
template: api_ideogram_v4_t2i.json
description: Input a text prompt in structured JSON format. Generate a high-quality
  image with precise layout control, text rendering, and color palette support.
tags:
- api
- hosted
- keyframe
outputs:
  type: image
  nodes:
  - '6'
params:
  filename_prefix:
    node: '6'
    field: filename_prefix
    type: str
  positive:
    node: '7'
    field: prompt
    type: str
    required: true
  seed:
    node: '7'
    field: seed
    type: int
    required: true
  aspect:
    node: '7'
    field: resolution
    type: enum
    enum_from:
      class_type: IdeogramV4
      input: resolution
    from_aspect:
      '16:9': 2560x1440 (16:9)
      '9:16': 1440x2560 (9:16)
      '1:1': 2048x2048 (1:1)
      '4:5': 1792x2240 (4:5)
      '4:3': 2304x1728 (4:3)
      '3:4': 1728x2304 (3:4)
  height:
    targets: []
    type: int
  width:
    targets: []
    type: int
cost:
  min_usd: 0.0429
  max_usd: 0.143

# cost: turbo .0429 / default .0858 / quality .143 per rendering_speed
# Read from ComfyUI's price_badge on 2026-09-30 (api.comfy.org credits, not the provider's list price).
