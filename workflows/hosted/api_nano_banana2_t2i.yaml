name: api_nano_banana2_t2i
kind: keyframe
template: api_nano_banana2_t2i.json
description: Generate images from text prompts using the Nano Banana 2 model, producing
  one image output with no file inputs required. Ideal for rapid prototyping, concept
  art generation, and creative exploration.
tags:
- api
- hosted
- keyframe
outputs:
  type: image
  nodes:
  - '9'
params:
  filename_prefix:
    node: '9'
    field: filename_prefix
    type: str
  positive:
    node: '24'
    field: prompt
    type: str
    required: true
  seed:
    node: '24'
    field: seed
    type: int
    required: true
  aspect:
    node: '24'
    field: model.aspect_ratio
    type: enum
    enum_from:
      class_type: GeminiNanoBanana2V2
      input: model.aspect_ratio
    from_aspect:
      '16:9': '16:9'
      '9:16': '9:16'
      '1:1': '1:1'
      '4:5': '4:5'
      '4:3': '4:3'
      '3:4': '3:4'
  height:
    targets: []
    type: int
  width:
    targets: []
    type: int
cost:
  min_usd: 0.0835
  max_usd: 0.1848

# cost: 1K .0835 / 2K .1217 / 4K .1848
# Read from ComfyUI's price_badge on 2026-09-30 (api.comfy.org credits, not the provider's list price).
