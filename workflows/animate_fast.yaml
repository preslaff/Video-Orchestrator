# Built-in: the `animate` graph with lightx2v's official 4-step I2V distill LoRAs on both experts
# (node 14 on HighNoise, node 15 on LowNoise). Same GGUF weights, same params as `animate`, so a
# profile can swap one name for the other. Defaults: 4 steps, split at 2, cfg 1 — the distill is
# trained without CFG, so the negative prompt has no effect here. Raising cfg or steps back toward
# `animate`'s 20/3.5 defeats the distill rather than improving it.
name: animate_fast
kind: animate
template: wan22_i2v_gguf_4step.json
description: Wan 2.2 i2v GGUF + lightx2v 4-step LoRAs (4 steps, cfg 1), 480p class, length must be 4n+1
tags: [wan, i2v, video, lightx2v, fast]
timeout: 1800
inputs: {start_image: image}
outputs: {type: video, nodes: ["13"]}
params:
  start_image:     {node: "5",  field: image,      type: str, required: true}
  positive:        {node: "6",  field: text,       type: str, required: true}
  negative:        {node: "7",  field: text,       type: str}
  width:           {node: "8",  field: width,      type: int, constraint: multiple_of_16, min: 256, max: 1280}
  height:          {node: "8",  field: height,     type: int, constraint: multiple_of_16, min: 256, max: 1280}
  length:          {node: "8",  field: length,     type: int, constraint: 4n+1, required: true}
  batch_size:      {node: "8",  field: batch_size, type: int, min: 1, max: 1}
  seed:            {targets: [{node: "9", field: noise_seed}, {node: "10", field: noise_seed}], type: int}
  steps:           {targets: [{node: "9", field: steps}, {node: "10", field: steps}], type: int, min: 2}
  split_step:      {targets: [{node: "9", field: end_at_step}, {node: "10", field: start_at_step}], type: int, min: 1}
  cfg:             {targets: [{node: "9", field: cfg}, {node: "10", field: cfg}], type: float}
  fps:             {node: "12", field: fps,        type: int, min: 1, max: 60}
  unet_high:       {node: "1",  field: unet_name,  type: enum, enum_from: {class_type: UnetLoaderGGUF, input: unet_name}}
  unet_low:        {node: "2",  field: unet_name,  type: enum, enum_from: {class_type: UnetLoaderGGUF, input: unet_name}}
  lora_strength:   {targets: [{node: "14", field: strength_model}, {node: "15", field: strength_model}], type: float, min: 0, max: 2}
  filename_prefix: {node: "13", field: filename_prefix, type: str}
