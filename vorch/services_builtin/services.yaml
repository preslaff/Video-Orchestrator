# Built-in service manifest. Override per service by name in ~/vorch/services.yaml
# (VORCH_SERVICES_FILE) — a user entry is merged over the built-in one key by key, so changing
# one path does not mean copying the whole entry.
#
# ${VORCH_X} resolves from the environment, falling back to config.X, so these entries follow
# whatever VORCH_* you already set in ~/vorch/vorch.env. @file:PATH inlines a file's stripped
# contents, resolved relative to the service's cwd.
#
# vram.holds_mb values are MEASURED on this machine (2026-09-24, RTX 5070 Ti, 16303 MiB total),
# not estimated. Re-measure when you change a model; do not guess. See docs/services.md.
version: 1

services:

  postgres:
    description: PostgreSQL — every job, decision, profile and project
    # Already a systemd unit, and `vorch db init` creates a database inside a running server,
    # not the server itself. vorch reports it and prints the hint; it never spawns it.
    manage: never
    health: {probe: dsn, target: "${VORCH_DATABASE_URL}", timeout: 3}
    vram: {class: none}
    lifetime: long
    hint: "sudo systemctl start postgresql   # then: python -m vorch db init"

  gemma:
    description: Gemma 4 26B via llama-server — storyboards, prompts, every vision verdict
    manage: full
    cwd: ~/WORK/llama.cpp
    argv:
      - ./build/bin/llama-server
      - -m
      - ~/models/gemma4/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
      - --mmproj                       # without this every verdict is meaningless (invariant #5)
      - ~/models/gemma4/mmproj-BF16.gguf
      - --n-gpu-layers
      - "0"
      - --no-mmproj-offload
      - --ctx-size
      - "32768"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    match: {cmdline_contains: ["llama-server"], cwd: ~/WORK/llama.cpp}
    health: {probe: http, url: "${VORCH_GEMMA_URL}/v1/models", timeout: 3}
    ready_timeout: 240                 # warm page cache ~30 s, cold from disk ~3 min
    # `--n-gpu-layers 0` does NOT mean zero VRAM: measured 1838 MiB of CUDA context and projector
    # scratch. "Gemma on CPU" is true of compute, not memory. A fixed tax, never evictable.
    vram: {class: resident, holds_mb: 1838}
    lifetime: long
    adopt: {allowed: true, verify: argv}
    log: gemma.log

  comfy:
    description: ComfyUI v0.42.5 — FLUX 3 / FLUX.2 Klein, Wan 2.2 (GGUF), ReActor
    manage: full
    # A git worktree of ~/comfy/ComfyUI at tag v0.42.5 (FLUX 3 needs >= 0.41). Its models/, input/
    # and output/ are symlinks into ~/comfy/ComfyUI, so VORCH_COMFY_ROOT does not move; only the
    # code and the venv differ. The old v0.34.0 checkout is the fallback: put the three ~/comfy/ComfyUI
    # and LTX-Colab/venv paths back. docs/workflows.md §0a has the A/B that justified the switch.
    cwd: ~/comfy/ComfyUI-next
    # main.py directly, with the interpreter named, rather than `comfy launch`. comfy-cli picks the
    # interpreter from VIRTUAL_ENV (comfy_cli/resolve_python.py) and falls back to the workspace's
    # own venv — which here has almost none of the custom-node dependencies: no gguf, so Wan's
    # UnetLoaderGGUF is missing, and no onnxruntime, so ReActor fails too. Naming the interpreter
    # removes the guess, and it is also what was running before any of this was managed.
    # venv-next is a copy of ~/WORK/LTX-Colab/venv with ComfyUI's own requirements upgraded
    # (same torch 2.11.0+cu130, `pip check` clean).
    argv: [~/comfy/venv-next/bin/python, main.py, --enable-manager]
    match: {cmdline_contains: ["main.py"], cwd: ~/comfy/ComfyUI-next}
    health: {probe: http, url: "${VORCH_COMFY_URL}/system_stats", timeout: 5}
    ready_timeout: 300                 # custom nodes import slowly
    # 222 MiB idle. needs_mb is VRAM that must be FREE ON THE CARD before a heavy render, not the
    # model's total size: Wan 2.2's dual model is ~22 GB of weights but streams through the card
    # with RAM offload, so demanding 22000 free would refuse every render on a 16303 MiB GPU.
    # 12000 is the working figure (VRAM_GUARD_MB's 10000 plus headroom for the vision evaluator).
    # Evictable WITHOUT stopping the process, which is why it is freed before anything is killed.
    vram: {class: elastic, needs_mb: 12000, holds_mb: 222, free_endpoint: /free}
    lifetime: long
    adopt: {allowed: true, verify: port}
    log: comfy.log

  tts:
    description: OmniVoice-BG — Bulgarian narration in a cloned voice
    manage: full
    cwd: ~/WORK/OmniVoice
    argv: [bash, serve_bg.sh]
    # The voice arrives ONLY as these env vars, and /health does not report it back. Leave them
    # out and serve_bg.sh reads in its built-in announcer's voice instead of yours.
    env:
      OMNIVOICE_BG_REF_AUDIO: "${VORCH_TTS_REF_AUDIO}"
      OMNIVOICE_BG_REF_TEXT: "@file:${VORCH_TTS_REF_TEXT_FILE}"
    match: {cmdline_contains: ["omnivoice.cli.serve"], cwd: ~/WORK/OmniVoice}
    health: {probe: http, url: "${VORCH_TTS_URL}/health", timeout: 2}
    ready_timeout: 300                 # ~90 s to load in practice
    # MEASURED, and it grows: 5726 MiB on a freshly started server, 11268 MiB on one that had been
    # up ~11 hours and spoken many lines (allocator growth and fragmentation). Both figures here are
    # the WORST case on purpose — an arbiter that under-reserves admits work that then OOMs. Either
    # way it cannot coexist with a Wan render on a 16303 MiB card, hence `exclusive`.
    vram: {class: exclusive, needs_mb: 11500, holds_mb: 11268}
    # Warm, not phase: rewording one line and pressing Speak again must not cost another 90 s.
    # Reaped after idle_timeout, but only ever a server vorch itself started.
    lifetime: warm
    idle_timeout: 600
    # verify: env reads /proc/<pid>/environ and compares the voice. A positively different voice
    # is a failure; merely unreadable is a warning, so a hand-started server is never blocked.
    adopt: {allowed: true, verify: env, on_unverified: warn}
    evict_adopted: true                # false -> refuse the render instead of stopping it
    log: tts.log

  api:
    description: vorch serve — the HTTP API and SSE stream the UI talks to
    manage: full
    cwd: .
    argv: [.venv/bin/python, -m, vorch, serve]
    match: {cmdline_contains: ["vorch serve"]}
    health: {probe: http, url: "${VORCH_API_URL}/api/setup/config", timeout: 3}
    ready_timeout: 60
    depends_on: [postgres]             # it opens a connection pool at startup
    vram: {class: none}
    lifetime: long
    adopt: {allowed: true, verify: port}
    log: api.log

  ui:
    description: Next.js control panel
    # Node toolchain with hot reload and no stake in the GPU: reported, never spawned.
    manage: adopt
    cwd: ./frontend
    argv: [npm, run, dev]
    # `npm run dev` becomes `next-server`; nothing of the original command survives.
    match: {cmdline_contains: ["next-server"]}
    health: {probe: http, url: "${VORCH_UI_URL}", timeout: 3}
    depends_on: [api]                  # it proxies /api to the server above
    vram: {class: none}
    lifetime: long
    hint: "cd frontend && npm run dev"
