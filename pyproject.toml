[project]
name = "vorch"
version = "0.1.0"
description = "Local, self-contained AI video-production orchestrator (Gemma 4 + ComfyUI)"
requires-python = ">=3.10"
# Core: HTTP client, structured-output validation, YAML scene specs.
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Backend + NiceGUI dashboard (later Phase-2 increments). Not imported yet.
app = [
    "instructor>=1.0",
    "fastapi>=0.110",
    "sse-starlette>=2.0",
    "nicegui>=2.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vorch = "vorch.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vorch*"]
