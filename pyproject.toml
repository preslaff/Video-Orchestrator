[project]
name = "vorch"
version = "0.1.0"
description = "Local, self-contained AI video-production orchestrator (Gemma 4 + ComfyUI)"
requires-python = ">=3.10"
# Core: HTTP client, structured-output validation, YAML scene specs, PostgreSQL state.
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
# HTTP API + SSE server (`vorch serve`); the UI is the Next.js app in frontend/.
app = [
    "instructor>=1.0",
    "fastapi>=0.110",
    "sse-starlette>=2.0",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Optional cloud backend (docs/modal-backend.md): the Modal client for `modal deploy|run`.
cloud = [
    "modal>=1.5",
]

[project.scripts]
vorch = "vorch.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vorch*"]

[tool.setuptools.package-data]
vorch = ["migrations/*.sql", "profiles_builtin/*.yaml"]
